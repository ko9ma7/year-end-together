<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>페이지를 찾을 수 없어요 · 모두의 연말</title><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#fbf8f0;color:#17382f;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif}.panel{text-align:center;max-width:420px;padding:40px}.badge{font-size:72px;font-weight:900;letter-spacing:-5px;color:#c87153}h1{font-size:32px;letter-spacing:-1.5px}p{line-height:1.8;color:#586961}a,button{border:0;display:inline-block;border-radius:12px;background:#17382f;color:white;padding:14px 19px;text-decoration:none;font:inherit;cursor:pointer;margin:8px 4px}.secondary{background:#e6eadd;color:#17382f}
</style></head><body><main class="panel"><div class="badge">404</div><h1>이 페이지는 없어요.</h1><p>잘못된 주소로 이동했거나, 모임 링크가 변경되었을 수 있어요.</p><a id="home" href="./">모임 목록으로</a><button class="secondary" onclick="history.back()">이전 페이지</button></main><script>let p=location.pathname.split('/').filter(Boolean);document.getElementById('home').href='/' + (p.length>1?p[0]+'/':'');</script></body></html>
